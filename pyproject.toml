[build-system]
requires = ["setuptools>=45", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "graphflow-python"
version = "0.1.0"
description = "Python SDK for the GraphFlow GraphEngine"
requires-python = ">=3.8"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["graphflow*"]
